<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      No <meta> Content-Security-Policy on purpose: the policy is delivered by the host as an HTTP
      header (frame-ancestors only works as a header). `npm run build:web -- --module html` writes the
      exact value to csp.json / headers.json next to manifest.json (sources: web/docs/build/csp.ts +
      the html entry of web/docs/build/modules.ts).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniWork HTML (web)</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- bridge must run first: it installs window.htmlApi / window.projectApi -->
    <script type="module" src="./install.ts"></script>
    <script type="module" src="../../../apps/html/src/renderer/main.tsx"></script>
  </body>
</html>
