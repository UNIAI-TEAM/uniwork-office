name: Release installers

# Builds the UniWork Office desktop installers for the dev and beta channels:
# Windows x64 (NSIS), macOS arm64 + x64 (dmg) and Linux x64 (AppImage, deb).
# The mac dmgs can be signed and notarized (mac signing below); Windows and
# Linux stay unsigned. See tools/release/README.md.
#
#   tag push v<version>-dev.<n> / v<version>-beta.<n>
#       build every platform, then publish a pre-release for the tag (never
#       marked latest) with the installers and SHA256SUMS-<platform>.txt, and
#       print OFFICE_INSTALLER_<CHANNEL>_URLS in the run summary.
#   workflow_dispatch (channel dev | beta, publish on)
#       from main only: take the next free v<version>-<channel>.<n> (highest
#       existing tag + 1), build every platform, then the publish job creates
#       that tag on the run's commit together with the pre-release. A tag made
#       with GITHUB_TOKEN starts no second run.
#   workflow_dispatch (publish off)
#       build every platform as version <version>-<channel>.<run number> and
#       keep the installers as workflow artifacts only (no tag, no release).
#
# The app learns which UniWork server to use from the web "open" link, from the
# address the user types, or from a default baked in here: the inputs
# default_api_origin / default_deployment_id (workflow_dispatch) or, on a tag
# push, the repository variables UNIWORK_DEFAULT_API_ORIGIN and
# UNIWORK_DEFAULT_DEPLOYMENT_ID. They reach the build as env of the same names;
# empty = no default (the app asks), one without the other or an invalid value
# fails the meta job before anything is built.
#
# <version> must equal apps/shell/package.json. Stable is refused while builds
# are unsigned. Auto-update reads the GitHub releases of this repository:
# UNIWORK_UPDATE_URL bakes the github feed into the Windows and Linux apps
# (pinned to the release channel), electron-builder writes <channel>.yml /
# <channel>-linux.yml next to the installers and the release carries them, so an
# installed dev build finds the next dev release. The unsigned mac app carries
# no feed (Squirrel.Mac needs a signed app); it reads this repository's releases
# itself (package.json uniworkReleaseFeed) and offers the newer dmg.
# check-build-brand.mjs --update-feed checks all of it. A tag must point at a commit
# on main. Only the publish job holds a write token, and it runs no repository
# code: it downloads the built files and calls gh release. Everything else
# (build jobs, the URL map) runs with contents: read.
#
# Mac signing: the repository variable UNIWORK_MAC_SIGNING_ENABLED = 'true'
# signs the mac app with the Developer ID Application identity, notarizes it
# and staples the dmgs. Only runs of main (a tag push, which meta checks is on
# main, or a dispatch from main) sign; any other ref builds the ad-hoc signed
# app as before. A signing run builds the mac dmgs in the macos_signed job
# (every other run in the macos job, which has no environment), and that job
# uses the GitHub environment mac-signing, which holds the secrets (names
# only): CSC_LINK, CSC_KEY_PASSWORD (the .p12, base64), APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. The job imports the .p12 into a
# temporary keychain of its own and deletes it at the end.
# Restrict that environment's deployment refs to main and v* tags and keep the
# secrets out of the repository-level list, so a workflow on another branch
# cannot read them.
#
# Download server and apt repository: after publish, the mirror job copies
# the release to the download bucket behind
# https://uniworkos.com/downloads/office/ with tools/release/apt-repo.sh
# (installers per channel and version, the GPG-signed apt repository, the
# generic update feed, releases.json) and prints OFFICE_INSTALLER_<CHANNEL>_URLS
# for those URLs. It uses the GitHub environment release-publish, which holds
# the secrets (names only): OFFICE_S3_ENDPOINT, OFFICE_S3_BUCKET,
# OFFICE_S3_ACCESS_KEY_ID, OFFICE_S3_SECRET_ACCESS_KEY, APT_GPG_PRIVATE_KEY,
# APT_GPG_PASSPHRASE; the optional repository variable OFFICE_S3_REGION
# (default hn-2) is not a secret. Restrict that environment's deployment refs
# to main and v* tags like mac-signing; no other job gets these secrets. The
# repository variable UNIWORK_APT_REPO_ENABLED = 'true' makes the Linux build
# ship the apt source in the deb (off until the repository is live).
#
# Windows signing hook (off): UNIWORK_SIGNING_ENABLED = 'true' with the
# variable GENOFFICE_WIN_SIGN_MODE (test | production) and the secrets
# scripts/win-sign.cjs reads; that script is not in this repository yet and
# must be added before the hook can run. Stable stays refused until both
# platforms sign.

on:
  push:
    tags: ['v*-dev.*', 'v*-beta.*']
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (stable is refused while builds are unsigned)
        type: choice
        options: [dev, beta]
        default: dev
      publish:
        description: Publish a pre-release as the next v<version>-<channel>.<n> (main only; off = workflow artifacts)
        type: boolean
        default: true
      default_api_origin:
        description: Server origin baked in as the default, e.g. https://uniwork.example (empty = none)
        type: string
        default: ''
      default_deployment_id:
        description: Deployment id of that server (required with default_api_origin)
        type: string
        default: ''

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
      mac_signed: ${{ steps.resolve.outputs.mac_signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history and branches: the tag commit is checked against main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve channel and version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          RUN_NUMBER: ${{ github.run_number }}
          MAC_SIGNING_ENABLED: ${{ vars.UNIWORK_MAC_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./apps/shell/package.json').version")"
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::release builds run on tags only"
              exit 1
            fi
            re='^v([0-9]+\.[0-9]+\.[0-9]+)-(dev|beta)\.([0-9]+)$'
            if ! [[ "$REF_NAME" =~ $re ]]; then
              echo "::error::tag $REF_NAME must look like v$base-dev.<n> or v$base-beta.<n>"
              exit 1
            fi
            if [ "${BASH_REMATCH[1]}" != "$base" ]; then
              echo "::error::tag version ${BASH_REMATCH[1]} differs from apps/shell/package.json $base"
              exit 1
            fi
            channel="${BASH_REMATCH[2]}"
            version="$base-$channel.${BASH_REMATCH[3]}"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $REF_NAME points at $GITHUB_SHA, which is not on main"
              exit 1
            fi
            tag="$REF_NAME"
            publish=true
            create_tag=false
          else
            channel="$INPUT_CHANNEL"
            case "$channel" in
              dev | beta) ;;
              *)
                echo "::error::channel must be dev or beta, got '$channel'"
                exit 1
                ;;
            esac
            if [ "$INPUT_PUBLISH" = "true" ]; then
              if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "main" ]; then
                echo "::error::publish runs from main only (got $REF_NAME); turn publish off to build another ref"
                exit 1
              fi
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::$GITHUB_SHA is not on main"
                exit 1
              fi
              # next free number for this base version and channel: highest tag + 1
              last=0
              while read -r existing; do
                n="${existing##*.}"
                if [[ "$n" =~ ^[0-9]+$ ]] && [ "$((10#$n))" -gt "$last" ]; then
                  last="$((10#$n))"
                fi
              done < <(git tag -l "v$base-$channel.*")
              next="$((last + 1))"
              version="$base-$channel.$next"
              tag="v$version"
              publish=true
              create_tag=true
            else
              version="$base-$channel.$RUN_NUMBER"
              tag=""
              publish=false
              create_tag=false
            fi
          fi
          # a tag push reaching this line is on main (checked above)
          mac_signed=false
          if [ "$MAC_SIGNING_ENABLED" = "true" ]; then
            if [ "$EVENT_NAME" = "push" ] || { [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "main" ]; }; then
              mac_signed=true
            else
              echo "::notice::mac signing runs from main only; $REF_NAME builds the ad-hoc signed mac app"
            fi
          fi
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "create_tag=$create_tag"
            echo "mac_signed=$mac_signed"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version (channel $channel, publish $publish, mac signed $mac_signed)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the baked default server
        env:
          UNIWORK_DEFAULT_API_ORIGIN: ${{ inputs.default_api_origin || vars.UNIWORK_DEFAULT_API_ORIGIN }}
          UNIWORK_DEFAULT_DEPLOYMENT_ID: ${{ inputs.default_deployment_id || vars.UNIWORK_DEFAULT_DEPLOYMENT_ID }}
          CHANNEL: ${{ steps.resolve.outputs.channel }}
        run: node apps/shell/build/deployment-defaults.cjs "$CHANNEL"

      # UniWork brand gate on the sources (dependency-free, see tools/rebrand/README.md)
      - name: Check brand
        run: npm run check:brand

      - name: Test the installer URL helper
        run: node --test tools/release/installer-urls.test.mjs

  windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      UNIWORK_RELEASE_CHANNEL: ${{ needs.meta.outputs.channel }}
      UNIWORK_DEFAULT_API_ORIGIN: ${{ inputs.default_api_origin || vars.UNIWORK_DEFAULT_API_ORIGIN }}
      UNIWORK_DEFAULT_DEPLOYMENT_ID: ${{ inputs.default_deployment_id || vars.UNIWORK_DEFAULT_DEPLOYMENT_ID }}
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      BUILD_DIR: ${{ github.workspace }}/release-out
      # the update feed: this repository's GitHub releases (Windows, Linux AppImage)
      UNIWORK_UPDATE_URL: https://github.com/${{ github.repository }}
      # Built natively on the Windows runner with MSVC; the crate's
      # .cargo/config.toml links the CRT statically for this target.
      GENOFFICE_WIN_SIDECAR_TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: release-electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: release-electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Test the build brand check
        run: node --test tools/release/check-build-brand.test.mjs

      - name: Build apps
        run: |
          npm run notices
          npm run build:all

      - name: Build the xlsx sidecar (x86_64-pc-windows-msvc)
        working-directory: apps/sheets
        run: >-
          cargo build --release
          --manifest-path native/xlsx-engine/Cargo.toml
          --config native/xlsx-engine/.cargo/config.toml
          --target x86_64-pc-windows-msvc

      - name: Build the Windows OCR helper
        run: node packages/pdf2docx/ocr-helper/build-win.mjs

      # Signing hook (off). electron-builder does not sign extraResources, so
      # the two helper binaries are signed here; the app, uninstaller and
      # installer go through the same script from electron-builder.cjs. When
      # scripts/win-sign.cjs lands, pass the secrets it reads to this step and
      # to "Package the installer".
      - name: Check the signing mode (signing hook)
        if: vars.UNIWORK_SIGNING_ENABLED == 'true'
        env:
          GENOFFICE_WIN_SIGN_MODE: ${{ vars.GENOFFICE_WIN_SIGN_MODE }}
        run: |
          case "$GENOFFICE_WIN_SIGN_MODE" in
            test | production) ;;
            *)
              echo "::error::signing is enabled but GENOFFICE_WIN_SIGN_MODE is '$GENOFFICE_WIN_SIGN_MODE' (test or production)"
              exit 1
              ;;
          esac
          if [ ! -f scripts/win-sign.cjs ]; then
            echo "::error::scripts/win-sign.cjs is not in this repository yet; add it before enabling signing"
            exit 1
          fi

      - name: Sign the helper binaries (signing hook)
        if: vars.UNIWORK_SIGNING_ENABLED == 'true'
        env:
          GENOFFICE_WIN_SIGN_MODE: ${{ vars.GENOFFICE_WIN_SIGN_MODE }}
        run: |
          set -euo pipefail
          for file in \
            apps/sheets/native/xlsx-engine/target/x86_64-pc-windows-msvc/release/xlsx-sidecar.exe \
            packages/pdf2docx/ocr-helper/win-ocr.exe; do
            node scripts/win-sign.cjs "$GENOFFICE_WIN_SIGN_MODE" "$file"
          done

      - name: Package the installer
        working-directory: apps/shell
        env:
          GENOFFICE_WIN_SIGN_MODE: ${{ vars.UNIWORK_SIGNING_ENABLED == 'true' && vars.GENOFFICE_WIN_SIGN_MODE || '' }}
        run: npx electron-builder --win --x64 --publish never "-c.extraMetadata.version=$RELEASE_VERSION"

      - name: Check the build output brand
        run: node tools/release/check-build-brand.mjs --dir "$BUILD_DIR" --expect win-unpacked --update-feed "github:$GITHUB_REPOSITORY"

      - name: Collect the installer, its update feed file and their SHA-256 sums
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          files=("$BUILD_DIR"/UniWork-Office_"$RELEASE_VERSION"_*win32_x64-setup.exe)
          if [ "${#files[@]}" != 1 ]; then
            echo "::error::expected one Windows installer for $RELEASE_VERSION, found ${#files[@]}"
            ls -la "$BUILD_DIR"
            exit 1
          fi
          feed="$BUILD_DIR/$UNIWORK_RELEASE_CHANNEL.yml"
          if [ ! -f "$feed" ]; then
            echo "::error::no update feed file $UNIWORK_RELEASE_CHANNEL.yml in the output"
            exit 1
          fi
          cp "${files[@]}" "$feed" upload/
          cd upload
          sha256sum -- * > SHA256SUMS-win32-x64.txt
          cat SHA256SUMS-win32-x64.txt
          {
            echo "### Windows x64"
            echo
            for file in *; do
              printf -- '- %s (%s bytes)\n' "$file" "$(wc -c < "$file" | tr -d ' ')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-win32-x64
          path: upload/*
          if-no-files-found: error
          retention-days: 14

  # No environment, so no signing secret can reach this job once the secrets
  # live in mac-signing: it builds the ad-hoc signed app.
  macos:
    needs: meta
    if: needs.meta.outputs.mac_signed != 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      UNIWORK_RELEASE_CHANNEL: ${{ needs.meta.outputs.channel }}
      UNIWORK_DEFAULT_API_ORIGIN: ${{ inputs.default_api_origin || vars.UNIWORK_DEFAULT_API_ORIGIN }}
      UNIWORK_DEFAULT_DEPLOYMENT_ID: ${{ inputs.default_deployment_id || vars.UNIWORK_DEFAULT_DEPLOYMENT_ID }}
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      BUILD_DIR: ${{ github.workspace }}/release-out
      # the update feed: this repository's GitHub releases (Windows, Linux AppImage)
      UNIWORK_UPDATE_URL: https://github.com/${{ github.repository }}
      # both arches: arm64 + x64 dmg from one fat sidecar / OCR helper
      GENOFFICE_MAC_X64: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: release-electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: release-electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build apps
        run: |
          npm run notices
          npm run build:all

      - name: Build the universal xlsx sidecar
        run: npm run native:build:universal -w @genoffice/sheets

      # Unsigned: no signing variable may reach electron-builder, not even an
      # empty one (CSC_LINK="" is taken as a certificate path and fails).
      - name: Package the dmgs
        working-directory: apps/shell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npx electron-builder --mac --publish never "-c.extraMetadata.version=$RELEASE_VERSION"

      # Apple Silicon refuses to launch an app without a valid signature; an
      # unsigned build must therefore carry an intact ad-hoc one.
      - name: Verify the app signatures
        run: |
          set -euo pipefail
          for dir in mac-arm64:arm64 mac:x86_64; do
            app="$BUILD_DIR/${dir%%:*}/UniWork Office.app"
            want="${dir##*:}"
            codesign --verify --deep --strict --verbose=2 "$app"
            details="$(codesign -dv --verbose=2 "$app" 2>&1)"
            echo "$details"
            grep -q '^Signature=adhoc' <<<"$details"
            archs="$(lipo -archs "$app/Contents/MacOS/UniWork Office")"
            if [ "$archs" != "$want" ]; then
              echo "::error::$app is $archs, expected $want"
              exit 1
            fi
          done

      - name: Check the build output brand
        run: node tools/release/check-build-brand.mjs --dir "$BUILD_DIR" --expect mac-arm64,mac --update-feed "github:$GITHUB_REPOSITORY"

      - name: Collect the dmgs and their SHA-256 sums
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          files=("$BUILD_DIR"/UniWork-Office_"$RELEASE_VERSION"_*darwin_arm64.dmg "$BUILD_DIR"/UniWork-Office_"$RELEASE_VERSION"_*darwin_x64.dmg)
          if [ "${#files[@]}" != 2 ]; then
            echo "::error::expected the arm64 and x64 dmgs for $RELEASE_VERSION, found ${#files[@]}"
            ls -la "$BUILD_DIR"
            exit 1
          fi
          cp "${files[@]}" upload/
          cd upload
          shasum -a 256 -- * > SHA256SUMS-darwin.txt
          cat SHA256SUMS-darwin.txt
          {
            echo "### macOS"
            echo
            for file in *; do
              printf -- '- %s (%s bytes)\n' "$file" "$(wc -c < "$file" | tr -d ' ')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dmgs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-darwin
          path: upload/*
          if-no-files-found: error
          retention-days: 14

  # Mac signing run: the only job that sees the signing secrets, which live in
  # the GitHub environment mac-signing (see the header). Same build as the
  # unsigned macos job above, with the sign + notarize package step.
  macos_signed:
    needs: meta
    if: needs.meta.outputs.mac_signed == 'true'
    runs-on: macos-latest
    environment: mac-signing
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      UNIWORK_RELEASE_CHANNEL: ${{ needs.meta.outputs.channel }}
      UNIWORK_DEFAULT_API_ORIGIN: ${{ inputs.default_api_origin || vars.UNIWORK_DEFAULT_API_ORIGIN }}
      UNIWORK_DEFAULT_DEPLOYMENT_ID: ${{ inputs.default_deployment_id || vars.UNIWORK_DEFAULT_DEPLOYMENT_ID }}
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      BUILD_DIR: ${{ github.workspace }}/release-out
      # the update feed: this repository's GitHub releases (Windows, Linux AppImage)
      UNIWORK_UPDATE_URL: https://github.com/${{ github.repository }}
      # both arches: arm64 + x64 dmg from one fat sidecar / OCR helper
      GENOFFICE_MAC_X64: '1'
      # the company Developer ID team; the verify steps refuse any other signer
      EXPECTED_TEAM_ID: XJAM488A6D
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First, so a missing environment or an empty secret fails in a minute
      # rather than after the build. The secrets are step env only (here and in
      # the package step): npm ci and the build never see them.
      - name: Check the signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::signing is enabled but these secrets are empty:$missing"
            exit 1
          fi

      # Own keychain instead of electron-builder's CSC_LINK import: electron-builder
      # 26.15 runs `security set-key-partition-list -k <p12 password>` against a
      # keychain it created with a random password, which macOS 26 rejects
      # ("SecKeychainUnlock: The user name or passphrase you entered is not
      # correct"; fixed upstream in 26.18). Here the keychain password is ours, and
      # electron-builder only gets the keychain (CSC_KEYCHAIN) and the identity
      # name (CSC_NAME, which also makes it name the dmgs without `unsigned`).
      - name: Import the signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/uniwork-signing.keychain-db"
          p12="$RUNNER_TEMP/uniwork-signing.p12"
          trap 'rm -f "$p12"' EXIT
          password="$(openssl rand -base64 24)"
          echo "::add-mask::$password"
          printf '%s' "${CSC_LINK#base64:}" | base64 --decode > "$p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # codesign finds the keychain and the intermediates in it through the search list
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          if ! grep -q 'Developer ID Application' <<<"$identities"; then
            echo "No valid Developer ID identity yet; adding Apple's Developer ID G2 intermediate to the keychain"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          fi
          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "Code signing identities in the temporary keychain:"
          echo "$identities"
          names="$(sed -n "s/.*\"Developer ID Application: \(.*($EXPECTED_TEAM_ID)\)\".*/\1/p" <<<"$identities")"
          if [ "$(printf '%s\n' "$names" | wc -l | tr -d ' ')" != 1 ] || [ -z "$names" ]; then
            echo "::error::expected exactly one valid Developer ID Application identity of team $EXPECTED_TEAM_ID in the certificate"
            exit 1
          fi
          echo "CSC_NAME=$names" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: release-electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: release-electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build apps
        run: |
          npm run notices
          npm run build:all

      - name: Build the universal xlsx sidecar
        run: npm run native:build:universal -w @genoffice/sheets

      # electron-builder signs with the identity and keychain the import step
      # exported (CSC_NAME, CSC_KEYCHAIN) and notarizes the app;
      # build/notarize-dmg.js notarizes and staples the dmgs.
      - name: Package, sign and notarize the dmgs
        working-directory: apps/shell
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never "-c.extraMetadata.version=$RELEASE_VERSION"

      # Developer ID identity of the company team, the hardened runtime and a
      # stapled ticket that Gatekeeper accepts.
      - name: Verify the app signatures
        run: |
          set -euo pipefail
          for dir in mac-arm64:arm64 mac:x86_64; do
            app="$BUILD_DIR/${dir%%:*}/UniWork Office.app"
            want="${dir##*:}"
            codesign --verify --deep --strict --verbose=2 "$app"
            details="$(codesign -dv --verbose=2 "$app" 2>&1)"
            echo "$details"
            grep -q '^Authority=Developer ID Application' <<<"$details"
            grep -q "^TeamIdentifier=$EXPECTED_TEAM_ID\$" <<<"$details"
            grep -q 'flags=.*(runtime)' <<<"$details"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            archs="$(lipo -archs "$app/Contents/MacOS/UniWork Office")"
            if [ "$archs" != "$want" ]; then
              echo "::error::$app is $archs, expected $want"
              exit 1
            fi
          done

      - name: Check the build output brand
        run: node tools/release/check-build-brand.mjs --dir "$BUILD_DIR" --expect mac-arm64,mac --update-feed "github:$GITHUB_REPOSITORY"

      - name: Collect the dmgs and their SHA-256 sums
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          files=("$BUILD_DIR"/UniWork-Office_"$RELEASE_VERSION"_*darwin_arm64.dmg "$BUILD_DIR"/UniWork-Office_"$RELEASE_VERSION"_*darwin_x64.dmg)
          if [ "${#files[@]}" != 2 ]; then
            echo "::error::expected the arm64 and x64 dmgs for $RELEASE_VERSION, found ${#files[@]}"
            ls -la "$BUILD_DIR"
            exit 1
          fi
          for file in "${files[@]}"; do
            case "$file" in
              *_unsigned_*)
                echo "::error::$file carries the unsigned label in a signing run"
                exit 1
                ;;
            esac
            details="$(codesign -dv --verbose=2 "$file" 2>&1)"
            grep -q "^TeamIdentifier=$EXPECTED_TEAM_ID\$" <<<"$details"
            xcrun stapler validate "$file"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$file"
          done
          cp "${files[@]}" upload/
          cd upload
          shasum -a 256 -- * > SHA256SUMS-darwin.txt
          cat SHA256SUMS-darwin.txt
          {
            echo "### macOS"
            echo
            for file in *; do
              printf -- '- %s (%s bytes)\n' "$file" "$(wc -c < "$file" | tr -d ' ')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dmgs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-darwin
          path: upload/*
          if-no-files-found: error
          retention-days: 14

      - name: Delete the signing keychain
        if: always()
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/uniwork-signing.p12

  linux:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      UNIWORK_RELEASE_CHANNEL: ${{ needs.meta.outputs.channel }}
      UNIWORK_DEFAULT_API_ORIGIN: ${{ inputs.default_api_origin || vars.UNIWORK_DEFAULT_API_ORIGIN }}
      UNIWORK_DEFAULT_DEPLOYMENT_ID: ${{ inputs.default_deployment_id || vars.UNIWORK_DEFAULT_DEPLOYMENT_ID }}
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      BUILD_DIR: ${{ github.workspace }}/release-out
      # the update feed: this repository's GitHub releases (Windows, Linux AppImage)
      UNIWORK_UPDATE_URL: https://github.com/${{ github.repository }}
      # 'true' ships the apt source (deb822) in the deb; only once the apt
      # repository on uniworkos.com is live (repository variable, off by default)
      UNIWORK_APT_SOURCE: ${{ vars.UNIWORK_APT_REPO_ENABLED == 'true' && 'true' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: release-electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: release-electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # build:all also builds the xlsx sidecar natively (cargo's host
      # target/release/, which the linux packaging config ships)
      - name: Build apps and the xlsx sidecar
        run: |
          npm run notices
          npm run build:all
          test -x apps/sheets/native/xlsx-engine/target/release/xlsx-sidecar

      # Linux packages are unsigned in every mode; the release config builds
      # the AppImage and the deb only (the download server has no rpm key).
      - name: Package the AppImage and the deb
        working-directory: apps/shell
        run: npx electron-builder --linux --x64 --publish never "-c.extraMetadata.version=$RELEASE_VERSION"

      # dpkg-deb reads the deb's control fields and desktop entry
      - name: Check the build output brand
        run: node tools/release/check-build-brand.mjs --dir "$BUILD_DIR" --expect linux-unpacked --update-feed "github:$GITHUB_REPOSITORY"

      # The post-install script replaces electron-builder's default one, so a
      # real install proves the launcher link, the URL handler registration,
      # the deployment profile carry-over and a clean uninstall.
      - name: Install check (deb)
        run: bash tools/release/linux-install-check.sh "$BUILD_DIR/UniWork-Office_${RELEASE_VERSION}_unsigned_linux_x64.deb"

      - name: Collect the packages, the AppImage update feed file and their SHA-256 sums
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          files=("$BUILD_DIR"/UniWork-Office_"$RELEASE_VERSION"_*linux_x64.deb "$BUILD_DIR"/UniWork-Office_"$RELEASE_VERSION"_*linux_x64.AppImage)
          if [ "${#files[@]}" != 2 ]; then
            echo "::error::expected the deb and the AppImage for $RELEASE_VERSION, found ${#files[@]}"
            ls -la "$BUILD_DIR"
            exit 1
          fi
          feed="$BUILD_DIR/$UNIWORK_RELEASE_CHANNEL-linux.yml"
          if [ ! -f "$feed" ]; then
            echo "::error::no update feed file $UNIWORK_RELEASE_CHANNEL-linux.yml in the output"
            exit 1
          fi
          cp "${files[@]}" "$feed" upload/
          cd upload
          sha256sum -- * > SHA256SUMS-linux-x64.txt
          cat SHA256SUMS-linux-x64.txt
          {
            echo "### Linux x64"
            echo
            for file in *; do
              printf -- '- %s (%s bytes)\n' "$file" "$(wc -c < "$file" | tr -d ' ')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-linux-x64
          path: upload/*
          if-no-files-found: error
          retention-days: 14

  # Read-only: runs the repository's URL helper on the built files. A file it
  # refuses (no unsigned label outside the mac dmgs, another channel) stops the
  # release before anything is published.
  urls:
    # exactly one of the two mac jobs runs (meta's mac_signed); a skipped one
    # must not stop the release, a failed or cancelled one must
    needs: [meta, windows, macos, macos_signed, linux]
    if: >-
      !cancelled() && needs.meta.outputs.publish == 'true'
      && needs.windows.result == 'success' && needs.linux.result == 'success'
      && ((needs.meta.outputs.mac_signed == 'true' && needs.macos_signed.result == 'success')
      || (needs.meta.outputs.mac_signed != 'true' && needs.macos.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download the installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: release-files
          merge-multiple: true

      - name: OFFICE_INSTALLER_*_URLS for this channel
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l release-files
          urls="$(node tools/release/installer-urls.mjs --channel "$CHANNEL" \
            --base-url "https://github.com/$REPOSITORY/releases/download/$TAG" --dir release-files)"
          name="OFFICE_INSTALLER_$(tr '[:lower:]' '[:upper:]' <<<"$CHANNEL")_URLS"
          echo "$urls" > "installer-urls-$CHANNEL.json"
          {
            echo "### $name"
            echo
            echo "Set this on the UniWork server (tools/release/README.md); OFFICE_INSTALLER_STABLE_URLS stays empty."
            echo
            echo '```'
            echo "$name=$urls"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the URL map
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-urls-${{ needs.meta.outputs.channel }}
          path: installer-urls-${{ needs.meta.outputs.channel }}.json
          if-no-files-found: error

  # Holds the write token, so it checks out nothing and runs no repository
  # code: download the built files, create the pre-release, upload them.
  publish:
    needs: [meta, urls]
    # urls runs although one mac job is skipped; without a status function the
    # implicit success() here could treat that skipped ancestor as a failure
    if: >-
      !cancelled() && needs.meta.outputs.publish == 'true'
      && needs.urls.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the pre-release and upload its assets
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      CREATE_TAG: ${{ needs.meta.outputs.create_tag }}
      MAC_SIGNED: ${{ needs.meta.outputs.mac_signed }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Download the installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: release-files
          merge-multiple: true

      # A dispatch run picked the tag before building; if someone took it
      # meanwhile, stop rather than add files to their release.
      - name: Check the tag is still free
        if: needs.meta.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG was created while this run was building; run the workflow again for the next number"
            exit 1
          fi

      - name: Create the pre-release and upload the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a re-run of an existing tag must not put dmgs of the other signing
            # state next to the ones already attached (the release title, body and
            # the update notice would then describe the wrong build)
            want=unsigned
            if [ "$MAC_SIGNED" = "true" ]; then want=signed; fi
            assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            while read -r name; do
              case "$name" in
                *_unsigned_darwin_*.dmg) old=unsigned ;;
                *_darwin_*.dmg) old=signed ;;
                *) continue ;;
              esac
              if [ "$old" != "$want" ]; then
                echo "::error::release $TAG already holds the $old dmg $name; this run builds $want dmgs. Cut the next tag number instead of re-running this one"
                exit 1
              fi
            done <<<"$assets"
          else
            # the body is the install note people read before the first launch
            NOTES="$(cat <<'NOTES_END'
          BUILD_PLACEHOLDER of UniWork Office for Windows x64, macOS (Apple Silicon and Intel) and Linux x64 (deb, AppImage). The Windows app and the Linux AppImage update themselves from these releases; the macOS app tells you when a newer build is out and downloads its dmg to install by hand; with the deb, install the next build from https://uniworkos.com/office. SHA-256 sums are attached.

          Install and first launch

          Windows: SmartScreen > More info > Run anyway.

          MAC_INSTALL_PLACEHOLDER

          Linux: sudo apt install ./<file>.deb, or chmod +x the AppImage and run it.
          NOTES_END
            )"
            if [ "$MAC_SIGNED" = "true" ]; then
              build="A $CHANNEL build (macOS signed and notarized by Apple; Windows and Linux unsigned)"
              mac_install="macOS: open the .dmg and drag UniWork Office to Applications."
              title_signing="mac signed, Windows/Linux unsigned"
            else
              build="Unsigned $CHANNEL build"
              mac_install="$(cat <<'MAC_END'
          macOS: a .dmg downloaded in a browser can show "is damaged and can't be opened. You should move it to the Trash." The file is fine; macOS blocks it because the build is not signed yet. Open Terminal and run:

              xattr -d com.apple.quarantine <path to the .dmg>

          (for example xattr -d com.apple.quarantine ~/Downloads/<file>.dmg), then open the .dmg again and drag UniWork Office to Applications. If macOS then says it could not verify the app, right-click the app > Open, or on macOS 15 and later open it once, then System Settings > Privacy & Security > scroll to the UniWork Office message > Open Anyway, and enter your password.
          MAC_END
              )"
              title_signing="unsigned"
            fi
            # quoted replacements: bash 5.2 otherwise expands & to the match
            NOTES="${NOTES//BUILD_PLACEHOLDER/"$build"}"
            NOTES="${NOTES//MAC_INSTALL_PLACEHOLDER/"$mac_install"}"
            # a tag push has its tag; a dispatch run creates it on its commit
            if [ "$CREATE_TAG" = "true" ]; then
              tag_args=(--target "$TARGET_SHA")
            else
              tag_args=(--verify-tag)
            fi
            gh release create "$TAG" "${tag_args[@]}" --prerelease --latest=false \
              --title "UniWork Office $TAG ($CHANNEL, $title_signing)" \
              --notes "$NOTES"
          fi
          gh release upload "$TAG" release-files/* --clobber

  # Copies the published release to the download bucket behind
  # https://uniworkos.com/downloads/office/ and updates the signed apt
  # repository, the generic update feed and releases.json there. The only job
  # with the bucket and apt signing secrets (environment release-publish); it
  # checks out tools/release only and runs nothing else of the repository.
  # All channels share one concurrency group, so two mirrors never interleave.
  mirror:
    needs: [meta, publish]
    if: >-
      !cancelled() && needs.meta.outputs.publish == 'true'
      && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: read
    concurrency:
      group: release-publish-mirror
      cancel-in-progress: false
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout the release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/release

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download the installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: release-files
          merge-multiple: true

      - name: Install apt-ftparchive
        run: |
          if ! command -v apt-ftparchive >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q apt-utils
          fi

      # releases.json carries the release body as the version's notes
      - name: Read the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"

      - name: Mirror to the download server
        env:
          OFFICE_S3_ENDPOINT: ${{ secrets.OFFICE_S3_ENDPOINT }}
          OFFICE_S3_BUCKET: ${{ secrets.OFFICE_S3_BUCKET }}
          OFFICE_S3_ACCESS_KEY_ID: ${{ secrets.OFFICE_S3_ACCESS_KEY_ID }}
          OFFICE_S3_SECRET_ACCESS_KEY: ${{ secrets.OFFICE_S3_SECRET_ACCESS_KEY }}
          OFFICE_S3_REGION: ${{ vars.OFFICE_S3_REGION }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          bash tools/release/apt-repo.sh --dir release-files --channel "$CHANNEL" --version "$VERSION" \
            --tag "$TAG" --git-sha "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: OFFICE_INSTALLER_*_URLS for the download server
        run: |
          set -euo pipefail
          urls="$(node tools/release/installer-urls.mjs --channel "$CHANNEL" \
            --base-url "https://uniworkos.com/downloads/office/$CHANNEL/$VERSION" --dir release-files)"
          name="OFFICE_INSTALLER_$(tr '[:lower:]' '[:upper:]' <<<"$CHANNEL")_URLS"
          {
            echo "### $name (uniworkos.com)"
            echo
            echo "The same installers on the download server; use this value once /downloads/office answers (tools/release/README.md)."
            echo
            echo '```'
            echo "$name=$urls"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
